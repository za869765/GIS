<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1c2c">
<meta name="description" content="臺南市佳里區 3D AI空照檢視（OpenMapTiles 建築擠出，非真實測量，AI推算僅供參考）">
<title>佳里區 3D AI空照檢視</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  :root {
    --bg: rgba(10, 22, 36, 0.88);
    --bg-solid: #0b1c2c;
    --panel: rgba(15, 32, 50, 0.94);
    --border: rgba(255, 255, 255, 0.14);
    --text: #f3f7fb;
    --muted: #a9b8c7;
    --accent: #3db8ff;
    --accent-2: #7dd3a7;
    --danger: #ff8a80;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --radius: 14px;
    --ctrl: 40px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --ui-bottom-gap: calc(52px + var(--safe-b));
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-solid);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Keep custom UI above MapLibre attribution (bottom-right). */
  .maplibregl-ctrl-bottom-right {
    z-index: 2;
    margin-bottom: 4px;
    max-width: min(100vw - 12px, 420px);
  }
  .maplibregl-ctrl-attrib {
    font-size: 10px !important;
    line-height: 1.35 !important;
    background: rgba(255, 255, 255, 0.92) !important;
    color: #222 !important;
    max-width: min(96vw, 420px);
  }
  .maplibregl-ctrl-attrib a { color: #0b57a4; }

  .ui-layer {
    position: absolute;
    z-index: 5;
    pointer-events: none;
  }
  .ui-layer > * { pointer-events: auto; }

  .top-bar {
    top: calc(10px + var(--safe-t));
    left: calc(10px + var(--safe-l));
    right: calc(10px + var(--safe-r));
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .brand {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px 12px;
    min-width: min(100%, 220px);
    backdrop-filter: blur(10px);
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  .controls {
    display: flex;
    flex-direction: column; /* 上排功能鍵、下排地區快捷 */
    gap: 6px;
    align-items: flex-end;
    max-width: min(100%, 640px);
  }
  .ctrl-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-end;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    min-height: var(--ctrl);
    min-width: var(--ctrl);
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:hover { border-color: rgba(61, 184, 255, 0.55); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn[aria-pressed="true"] {
    background: linear-gradient(180deg, rgba(61, 184, 255, 0.28), rgba(61, 184, 255, 0.12));
    border-color: rgba(61, 184, 255, 0.7);
  }
  .btn[aria-disabled="true"],
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-primary {
    background: linear-gradient(180deg, rgba(61, 184, 255, 0.35), rgba(20, 80, 120, 0.55));
  }
  .btn .ico {
    font-size: 13px;
    line-height: 1;
  }

  .bottom-panel {
    left: calc(10px + var(--safe-l));
    right: calc(10px + var(--safe-r));
    bottom: var(--ui-bottom-gap);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
  }

  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--muted);
    backdrop-filter: blur(10px);
    max-width: min(100%, 640px);
  }
  .note strong { color: var(--text); font-weight: 700; }

  /* 街景卡（極簡）：display:flex 會蓋過 [hidden] 的 UA display:none，需明確補回 */
  #sv-card {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    padding: 6px 8px;
    max-width: min(96vw, 460px);
  }
  #sv-card[hidden] { display: none; }
  #sv-thumb {
    display: block;
    width: 118px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: zoom-in;
    flex: none;
    touch-action: none; /* 讓 pointer 拖曳旋轉在觸控裝置可用 */
    user-select: none;
    -webkit-user-drag: none;
  }
  #sv-thumb[hidden] { display: none; }
  /* 騎行中：縮圖放大作沿途街景輔助畫面 */
  #sv-card.riding #sv-thumb { width: 236px; height: 140px; }
  #sv-card.riding { max-width: min(96vw, 560px); }
  #sv-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 10.5px;
    line-height: 1.35;
    min-width: 0;
  }
  #sv-coord { color: var(--muted); }
  #sv-nopano { color: var(--muted); }
  #sv-bldg { color: var(--accent-2); font-weight: 600; }
  #sv-road { color: #ffc57a; font-weight: 600; }
  #btn-sv-close {
    min-height: 26px;
    min-width: 26px;
    padding: 0 7px;
    font-size: 12px;
    flex: none;
    align-self: flex-start;
  }
  #sv-lightbox {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(4, 10, 18, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    backdrop-filter: blur(4px);
  }
  #sv-lightbox[hidden] { display: none; }
  #sv-lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  #sv-lightbox img[hidden] { display: none; }
  #sv-lightbox iframe {
    width: min(92vw, 1280px);
    height: 86vh;
    border: 0;
    border-radius: 12px;
    box-shadow: var(--shadow);
    background: #000;
  }
  #sv-lightbox iframe[hidden] { display: none; }
  #sv-pano {
    width: min(92vw, 1280px);
    height: 86vh;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: #000;
  }
  #sv-pano[hidden] { display: none; }
  #sv-lightbox-close {
    position: absolute;
    top: calc(12px + var(--safe-t));
    right: calc(12px + var(--safe-r));
    z-index: 61;
  }
  #sv-lightbox-open {
    position: absolute;
    top: calc(12px + var(--safe-t));
    right: calc(112px + var(--safe-r));
    z-index: 61;
  }

  /* 常駐指北針：MapLibre 縮放鈕上方 */
  #compass {
    position: fixed;
    right: calc(9px + var(--safe-r));
    bottom: calc(178px + var(--safe-b));
    z-index: 7;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #compass:hover { border-color: rgba(61, 184, 255, 0.55); }
  #compass svg { transition: transform 0.15s linear; }

  /* 騎行/飛行狀態列 */
  #ride-note { display: flex; align-items: center; gap: 10px; }
  #ride-note[hidden] { display: none; }
  #ride-note-txt { font-weight: 700; color: #7dd3a7; }
  #btn-ride-stop { min-height: 28px; padding: 0 10px; font-size: 12px; flex: none; }

  .status {
    position: absolute;
    z-index: 6;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 340px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    text-align: center;
    backdrop-filter: blur(12px);
  }
  .status[hidden] { display: none !important; }
  .status h2 {
    margin: 0 0 8px;
    font-size: 15px;
  }
  .status p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .status.error h2 { color: var(--danger); }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 12px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--accent-2); }
    .btn { transition: none; }
  }

  @media (max-width: 640px) {
    .brand { padding: 8px 10px; }
    .brand h1 { font-size: 14px; }
    .btn {
      min-height: 38px;
      padding: 0 10px;
      font-size: 11px;
    }
    .controls { max-width: 100%; }
    .note { font-size: 10.5px; max-width: 100%; }
    /* 原 140px 右保留是給已移除的常駐免責 note 避讓比例尺用；街景卡是點擊才出現的
       暫時 UI，允許蓋到比例尺，改回全寬避免卡片被擠成窄長條（實測 375px 曾壓到 225px 寬） */
    .bottom-panel {
      right: calc(10px + var(--safe-r));
      bottom: calc(var(--ui-bottom-gap) + 64px);
    }
    #sv-card { flex-wrap: wrap; }
  }

  /* Visually hidden helper for screen readers if needed */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <div id="map" role="application" aria-label="佳里區 3D 地圖"></div>

  <div id="loading" class="status" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <h2>載入中</h2>
    <p>正在準備地圖與佳里區邊界…</p>
  </div>

  <div id="error" class="status error" role="alert" aria-live="assertive" hidden>
    <h2>載入失敗</h2>
    <p id="error-msg">無法載入地圖資源。請檢查網路後重新整理。</p>
    <p style="margin-top:10px">
      <button type="button" class="btn btn-primary" id="btn-retry">重新載入</button>
    </p>
  </div>

  <div class="ui-layer top-bar">
    <div class="brand">
      <h1>佳里區 3D AI空照</h1>
      <!-- 免責合併於此（原底部 note 太擋地圖）；id 保留給邊界載入失敗訊息 append -->
      <p id="source-note">· 非真實測量・AI推算可能有誤，僅供參考。</p>
    </div>
    <div class="controls" role="toolbar" aria-label="地圖控制">
      <div class="ctrl-row">
        <a class="btn btn-primary" href="jialie_gis_v6.html" id="btn-back" title="返回一般地圖模式">
          <span class="ico" aria-hidden="true">←</span>返回一般地圖模式
        </a>
        <button type="button" class="btn" id="btn-vector" aria-pressed="false" title="OpenFreeMap 向量底圖">向量圖</button>
        <button type="button" class="btn" id="btn-satellite" aria-pressed="true" title="Esri 衛星影像底圖">衛星圖</button>
        <button type="button" class="btn" id="btn-fly" aria-pressed="false" title="自動環景巡覽">環景</button>
        <button type="button" class="btn" id="btn-buildings" aria-pressed="true" title="顯示或隱藏 3D 建築">
          3D 建築
        </button>
        <button type="button" class="btn" id="btn-svlines" aria-pressed="true" title="顯示或隱藏街景覆蓋藍線（有藍線的路才有街景）">
          街景線
        </button>
        <button type="button" class="btn" id="btn-ride" aria-pressed="false" title="機車騎行預覽：點地圖設定起訖點，沿路線騎行並顯示沿途街景">🛵 騎行</button>
        <button type="button" class="btn" id="btn-plane" aria-pressed="false" title="飛行檢視：點地圖設定起訖點，飛行視角飛過去">✈️ 飛行</button>
      </div>
      <div class="ctrl-row">
        <button type="button" class="btn" id="btn-center" title="佳里市中心視角">佳里市中心</button>
        <button type="button" class="btn" id="btn-zilong" title="子龍（市中心東邊）">子龍</button>
        <button type="button" class="btn" id="btn-jialixing" title="佳里興（市中心北邊）">佳里興</button>
        <button type="button" class="btn" id="btn-wennei" title="塭內（市中心南邊）">塭內</button>
        <button type="button" class="btn" id="btn-xiabu" title="下廍（市中心西邊）">下廍</button>
      </div>
    </div>
  </div>

  <!-- 常駐指北針：紅針指北，隨地圖旋轉，點擊回正北 -->
  <button type="button" id="compass" title="指北針：點擊回正北" aria-label="指北針，點擊回正北">
    <svg id="compass-needle" width="30" height="30" viewBox="0 0 30 30">
      <polygon points="15,3 19.5,15 10.5,15" fill="#e74c3c"/>
      <polygon points="15,27 19.5,15 10.5,15" fill="#eef3f8"/>
      <circle cx="15" cy="15" r="2.4" fill="#28394a" stroke="#fff" stroke-width="1"/>
    </svg>
  </button>

  <div class="ui-layer bottom-panel">
    <!-- 騎行/飛行模式狀態列 -->
    <div class="note" id="ride-note" hidden>
      <span id="ride-note-txt">點地圖設定起點</span>
      <button type="button" class="btn" id="btn-ride-stop">■ 停止</button>
    </div>
    <!-- 點地圖任一處浮現街景卡（極簡版）：點縮圖 → 互動式街景放大檢視 -->
    <div class="note" id="sv-card" hidden>
      <img id="sv-thumb" alt="街景預覽" title="左右拖曳旋轉方向・點擊放大（360° 環視）" draggable="false" hidden>
      <div id="sv-info">
        <span id="sv-coord">📍</span>
        <span id="sv-nopano" hidden>此處無街景覆蓋</span>
        <span id="sv-bldg" hidden></span>
        <span id="sv-road" hidden></span>
      </div>
      <button type="button" class="btn" id="btn-sv-close" aria-label="關閉街景卡">✕</button>
    </div>
  </div>

  <!-- 街景放大檢視：有 SV_EMBED_KEY → 互動式街景 iframe（360° 拖曳）；沒有 → 靜態圖。
       點背景、✕ 或 Esc 關閉（iframe 會吃掉滑鍵事件，故必留 ✕ 鈕） -->
  <div id="sv-lightbox" hidden>
    <a class="btn" id="sv-lightbox-open" target="_blank" rel="noopener" title="在 Google 地圖開啟完整街景">Google 地圖 ↗</a>
    <button type="button" class="btn" id="sv-lightbox-close" aria-label="關閉放大檢視">✕ 關閉</button>
    <div id="sv-pano" hidden></div>
    <iframe id="sv-lightbox-frame" title="互動式街景（可拖曳環視）" allowfullscreen referrerpolicy="origin" hidden></iframe>
    <img id="sv-lightbox-img" alt="街景放大預覽">
  </div>

<script>
(function () {
  'use strict';

  /* 僅允許從主頁 GIS 轉入（主頁 openJiali3D() 會先種 sessionStorage 交棒旗標；
     同分頁導航旗標跟著走、F5 重整也在）。直接開網址（無旗標、無同源 referrer）
     → 導回主頁。副作用：直接分享 3D 深連結的人會被帶回主頁重進。 */
  var fromGis = false;
  try { fromGis = sessionStorage.getItem('gis-3d-ok') === '1'; } catch (_) {}
  if (!fromGis && document.referrer.indexOf(location.origin + '/') !== 0) {
    location.replace('jialie_gis_v6.html');
    return;
  }
  try { sessionStorage.setItem('gis-3d-ok', '1'); } catch (_) {}

  /** @type {const} */
  var CENTER = [120.1777263, 23.1638778];
  /* Current taiwan-atlas / Taiwan administrative town code for 佳里區. */
  var TOWN_CODES = ['67000120'];
  var TOWN_NAME = '佳里區';
  var TOWNS_URL = 'https://cdn.jsdelivr.net/npm/taiwan-atlas@latest/towns-10t.json';
  var LIBERTY_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
  var ESRI_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  /* 街景卡縮圖預覽走同源 Pages Function 代理（/api/sv），API key 存 Pages secret 不落前端。
     mode=meta 查覆蓋（免費）、mode=img 取靜態圖（每月前 1 萬次免費） */
  var SV_PROXY = '/api/sv';
  /* 街景覆蓋藍線圖磚（Google 地圖自家 svv 圖層，透明 PNG、免 key、不計費；
     非官方端點，若日後失效僅藍線消失、其餘功能不受影響） */
  var SVV_SRC = 'sv-coverage';
  var SVV_LAYER = 'sv-coverage-layer';
  var SVV_TILES = [0, 1, 2, 3].map(function (i) {
    return 'https://mts' + i + '.google.com/vt?hl=zh-TW&lyrs=svv|cb_client:apiv3&style=40,18&x={x}&y={y}&z={z}';
  });
  var ESRI_ATTR =
    'Tiles &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener noreferrer">Esri</a> — ' +
    'Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community';

  var DEFAULTS = {
    center: CENTER.slice(),
    zoom: 15.6,
    bearing: -28,
    pitch: 58
  };

  /* 聚落快捷視角（OSM place 節點；塭內以派出所/國小推定聚落中心） */
  var PLACES = {
    zilong:    [120.20762, 23.17319], /* 子龍（東） */
    jialixing: [120.18981, 23.18981], /* 佳里興（北） */
    wennei:    [120.16500, 23.12500], /* 塭內（南） */
    xiabu:     [120.15140, 23.17197]  /* 下廍（西） */
  };

  var BUILDING_LAYER_ID = 'building-3d';
  var BOUNDARY_SRC = 'jiali-boundary';
  var BOUNDARY_FILL = 'jiali-boundary-fill';
  var BOUNDARY_LINE = 'jiali-boundary-line';
  var MASK_SRC = 'jiali-mask';
  var MASK_LAYER = 'jiali-mask-fill';
  var ESRI_SRC = 'esri-world-imagery';
  var ESRI_LAYER = 'esri-world-imagery-layer';

  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (_) {}

  var state = {
    basemap: 'satellite', // 'vector' | 'satellite'
    buildingsOn: true,
    svLinesOn: true,
    flying: false,
    boundaryFeature: null,
    boundaryBounds: null,
    styleReady: false
  };

  var map = null;
  var flyRaf = 0;
  var flyToken = 0;

  var elLoading = document.getElementById('loading');
  var elError = document.getElementById('error');
  var elErrorMsg = document.getElementById('error-msg');
  var btnVector = document.getElementById('btn-vector');
  var btnSatellite = document.getElementById('btn-satellite');
  var btnRide = document.getElementById('btn-ride');
  var btnPlane = document.getElementById('btn-plane');
  var btnRideStop = document.getElementById('btn-ride-stop');
  var elRideNote = document.getElementById('ride-note');
  var elRideNoteTxt = document.getElementById('ride-note-txt');
  var elCompass = document.getElementById('compass');
  var elCompassNeedle = document.getElementById('compass-needle');
  var btnCenter = document.getElementById('btn-center');
  var btnFly = document.getElementById('btn-fly');
  var btnBuildings = document.getElementById('btn-buildings');
  var btnSvlines = document.getElementById('btn-svlines');
  var btnRetry = document.getElementById('btn-retry');
  var elSvCard = document.getElementById('sv-card');
  var elSvCoord = document.getElementById('sv-coord');
  var btnSvClose = document.getElementById('btn-sv-close');
  var elSvThumb = document.getElementById('sv-thumb');
  var elSvNopano = document.getElementById('sv-nopano');
  var elSvLightbox = document.getElementById('sv-lightbox');
  var elSvLightboxImg = document.getElementById('sv-lightbox-img');
  var elSvLightboxFrame = document.getElementById('sv-lightbox-frame');
  var btnSvLightboxClose = document.getElementById('sv-lightbox-close');
  var elSvLightboxOpen = document.getElementById('sv-lightbox-open');
  var elSvPano = document.getElementById('sv-pano');
  var elSvBldg = document.getElementById('sv-bldg');
  var elSvRoad = document.getElementById('sv-road');

  function clamp(n, min, max) {
    return Math.min(max, Math.max(min, n));
  }

  function parseNum(v) {
    if (v == null || v === '') return null;
    var n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function normalizeBearing(b) {
    // MapLibre accepts any number; normalize to (-180, 180]
    var x = ((b % 360) + 360) % 360;
    return x > 180 ? x - 360 : x;
  }

  function readCameraFromQuery() {
    var q = new URLSearchParams(window.location.search);
    var lat = parseNum(q.get('lat'));
    var lng = parseNum(q.get('lng'));
    var z = parseNum(q.get('z'));
    var bearing = parseNum(q.get('bearing'));
    var pitch = parseNum(q.get('pitch'));

    var center = DEFAULTS.center.slice();
    if (lat != null && lng != null) {
      center = [clamp(lng, -180, 180), clamp(lat, -90, 90)];
    } else if (lat != null) {
      center[1] = clamp(lat, -90, 90);
    } else if (lng != null) {
      center[0] = clamp(lng, -180, 180);
    }

    return {
      center: center,
      zoom: z != null ? clamp(z, 0, 22) : DEFAULTS.zoom,
      bearing: bearing != null ? normalizeBearing(bearing) : DEFAULTS.bearing,
      pitch: pitch != null ? clamp(pitch, 0, 85) : DEFAULTS.pitch
    };
  }

  function showLoading(msg) {
    elError.hidden = true;
    elLoading.hidden = false;
    elLoading.setAttribute('aria-busy', 'true');
    if (msg) {
      var p = elLoading.querySelector('p');
      if (p) p.textContent = msg;
    }
  }

  function hideLoading() {
    elLoading.hidden = true;
    elLoading.setAttribute('aria-busy', 'false');
  }

  function showError(msg) {
    hideLoading();
    elError.hidden = false;
    elErrorMsg.textContent = msg || '無法載入地圖資源。請檢查網路後重新整理。';
  }

  function easeDuration(ms) {
    return reduceMotion ? 0 : ms;
  }

  function stopFlyover() {
    flyToken += 1;
    if (flyRaf) {
      cancelAnimationFrame(flyRaf);
      flyRaf = 0;
    }
    state.flying = false;
    btnFly.setAttribute('aria-pressed', 'false');
    btnFly.textContent = '環景';
  }

  function startFlyover() {
    if (!map || !state.styleReady) return;
    if (state.basemap !== 'satellite') return; /* 環景只在衛星圖可用 */
    if (reduceMotion) {
      // Gentle static reframe instead of continuous motion
      goCityCenter();
      return;
    }
    stopFlyover();
    state.flying = true;
    btnFly.setAttribute('aria-pressed', 'true');
    btnFly.textContent = '停止';

    var token = flyToken;
    var origin = map.getCenter();
    var baseLng = origin.lng;
    var baseLat = origin.lat;
    var radius = 0.012; // ~1.3 km-ish at this latitude
    var start = performance.now();
    var period = 48000; // full orbit ~48s
    var baseZoom = clamp(map.getZoom(), 14.2, 16.2);
    var basePitch = clamp(map.getPitch() || DEFAULTS.pitch, 45, 65);

    function frame(now) {
      if (token !== flyToken || !state.flying) return;
      var t = (now - start) / period;
      var ang = t * Math.PI * 2;
      var lng = baseLng + Math.cos(ang) * radius;
      var lat = baseLat + Math.sin(ang) * radius * 0.85;
      var bearing = normalizeBearing((-ang * 180) / Math.PI + 90);
      map.jumpTo({
        center: [lng, lat],
        zoom: baseZoom,
        bearing: bearing,
        pitch: basePitch
      });
      flyRaf = requestAnimationFrame(frame);
    }
    flyRaf = requestAnimationFrame(frame);
  }

  function toggleFlyover() {
    if (state.flying) stopFlyover();
    else startFlyover();
  }

  function goCityCenter() {
    stopFlyover();
    if (!map) return;
    map.easeTo({
      center: CENTER.slice(),
      zoom: DEFAULTS.zoom,
      bearing: DEFAULTS.bearing,
      pitch: DEFAULTS.pitch,
      duration: easeDuration(1200)
    });
  }

  /* 聚落快捷視角（子龍/佳里興/塭內/下廍） */
  function goPlace(key) {
    stopFlyover();
    if (!map || !PLACES[key]) return;
    map.easeTo({
      center: PLACES[key].slice(),
      zoom: 15.8,
      bearing: DEFAULTS.bearing,
      pitch: DEFAULTS.pitch,
      duration: easeDuration(1400)
    });
  }

  /* 常駐指北針：紅針隨地圖 bearing 反向旋轉恆指北，點擊回正北 */
  function updateCompass() {
    if (elCompassNeedle && map) {
      elCompassNeedle.style.transform = 'rotate(' + (-map.getBearing()) + 'deg)';
    }
  }

  function setBuildingsVisible(on) {
    state.buildingsOn = !!on;
    btnBuildings.setAttribute('aria-pressed', state.buildingsOn ? 'true' : 'false');
    if (!map || !state.styleReady) return;
    if (!map.getLayer(BUILDING_LAYER_ID)) return;
    map.setLayoutProperty(
      BUILDING_LAYER_ID,
      'visibility',
      state.buildingsOn ? 'visible' : 'none'
    );
  }

  function ensureEsriLayer() {
    if (!map.getSource(ESRI_SRC)) {
      map.addSource(ESRI_SRC, {
        type: 'raster',
        tiles: [ESRI_TILES],
        tileSize: 256,
        attribution: ESRI_ATTR,
        maxzoom: 19
      });
    }
    if (!map.getLayer(ESRI_LAYER)) {
      // Put imagery above vector ground/roads and below buildings/labels.
      var beforeId = null;
      var layers = map.getStyle().layers || [];
      if (map.getLayer('building')) {
        beforeId = 'building';
      } else if (map.getLayer(BUILDING_LAYER_ID)) {
        beforeId = BUILDING_LAYER_ID;
      } else {
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].type === 'symbol') {
            beforeId = layers[i].id;
            break;
          }
        }
      }
      map.addLayer(
        {
          id: ESRI_LAYER,
          type: 'raster',
          source: ESRI_SRC,
          paint: { 'raster-opacity': 1 }
        },
        beforeId || undefined
      );
    }
  }

  function ensureSvvLayer() {
    if (!map.getSource(SVV_SRC)) {
      map.addSource(SVV_SRC, {
        type: 'raster',
        tiles: SVV_TILES,
        tileSize: 256,
        attribution: '街景覆蓋 &copy; Google',
        maxzoom: 21
      });
    }
    if (!map.getLayer(SVV_LAYER)) {
      // 與 Esri 同錨點插入（building/symbol 之前）：位於衛星影像之上、建築與標籤之下
      var beforeId = null;
      var layers = map.getStyle().layers || [];
      if (map.getLayer('building')) {
        beforeId = 'building';
      } else if (map.getLayer(BUILDING_LAYER_ID)) {
        beforeId = BUILDING_LAYER_ID;
      } else {
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].type === 'symbol') {
            beforeId = layers[i].id;
            break;
          }
        }
      }
      map.addLayer(
        {
          id: SVV_LAYER,
          type: 'raster',
          source: SVV_SRC,
          paint: { 'raster-opacity': 0.9 }
        },
        beforeId || undefined
      );
    }
  }

  function setSvLinesVisible(on) {
    state.svLinesOn = !!on;
    btnSvlines.setAttribute('aria-pressed', state.svLinesOn ? 'true' : 'false');
    if (!map || !state.styleReady) return;
    ensureSvvLayer();
    if (map.getLayer(SVV_LAYER)) {
      map.setLayoutProperty(SVV_LAYER, 'visibility', state.svLinesOn ? 'visible' : 'none');
    }
  }

  // Track vector base layers we hid while satellite imagery covers them, so we can
  // restore exactly those when switching back to the vector basemap.
  var hiddenForSatellite = [];

  function hideVectorBaseForSatellite() {
    if (!map || !map.getLayer(ESRI_LAYER)) return;
    if (hiddenForSatellite.length) return; // already hidden — idempotent
    var layers = (map.getStyle() && map.getStyle().layers) || [];
    for (var i = 0; i < layers.length; i++) {
      var ly = layers[i];
      if (ly.id === ESRI_LAYER) break; // only layers rendered *below* the imagery are covered
      // Keep the cheap background quad visible so a failed imagery tile shows a
      // neutral base instead of the dark app background. Leave our own overlays alone.
      if (ly.type !== 'fill' && ly.type !== 'line' &&
          ly.type !== 'fill-extrusion' && ly.type !== 'hillshade') continue;
      if (ly.id === BUILDING_LAYER_ID || ly.id === BOUNDARY_FILL || ly.id === BOUNDARY_LINE) continue;
      var vis = map.getLayoutProperty(ly.id, 'visibility');
      if (vis !== 'none') {
        hiddenForSatellite.push(ly.id);
        map.setLayoutProperty(ly.id, 'visibility', 'none');
      }
    }
  }

  function restoreVectorBase() {
    if (!map) { hiddenForSatellite = []; return; }
    for (var i = 0; i < hiddenForSatellite.length; i++) {
      if (map.getLayer(hiddenForSatellite[i])) {
        map.setLayoutProperty(hiddenForSatellite[i], 'visibility', 'visible');
      }
    }
    hiddenForSatellite = [];
  }

  function setBasemap(mode) {
    state.basemap = mode === 'satellite' ? 'satellite' : 'vector';
    var satelliteOn = state.basemap === 'satellite';
    /* 兩顆獨立按鈕：作用中的那顆亮藍邊（aria-pressed 樣式） */
    btnVector.setAttribute('aria-pressed', satelliteOn ? 'false' : 'true');
    btnSatellite.setAttribute('aria-pressed', satelliteOn ? 'true' : 'false');
    /* 環景只在衛星圖可用 */
    btnFly.disabled = !satelliteOn;
    if (!satelliteOn && state.flying) stopFlyover();
    if (!map || !state.styleReady) return;

    if (state.basemap === 'satellite') {
      ensureEsriLayer();
      if (map.getLayer(ESRI_LAYER)) {
        map.setLayoutProperty(ESRI_LAYER, 'visibility', 'visible');
      }
      hideVectorBaseForSatellite();
    } else {
      if (map.getLayer(ESRI_LAYER)) {
        map.setLayoutProperty(ESRI_LAYER, 'visibility', 'none');
      }
      restoreVectorBase();
    }

    setBuildingsVisible(state.buildingsOn);
    setSvLinesVisible(state.svLinesOn);
    ensureRoadQueryLayers(); // 路寬估算的查詢專用透明線（衛星模式也可點）
    ensureTrailLayer();      // 街景移動軌跡（暫存）
    // Ensure boundary stays on top of basemap fills
    raiseBoundary();
  }

  function raiseBoundary() {
    if (!map) return;
    // 遮罩最先抬（蓋過衛星影像），fill 次之，line 最上讓虛線邊界清楚
    if (map.getLayer(MASK_LAYER)) {
      try { map.moveLayer(MASK_LAYER); } catch (_) {}
    }
    if (map.getLayer(BOUNDARY_FILL)) {
      try { map.moveLayer(BOUNDARY_FILL); } catch (_) {}
    }
    if (map.getLayer(BOUNDARY_LINE)) {
      try { map.moveLayer(BOUNDARY_LINE); } catch (_) {}
    }
  }

  /* 區外遮罩：世界矩形挖掉佳里區邊界（洞），區外明顯壓暗一眼辨識轄區 */
  function buildMaskFeature(f) {
    var holes = [];
    var g = f && f.geometry;
    if (g && g.type === 'Polygon') holes.push(g.coordinates[0]);
    else if (g && g.type === 'MultiPolygon') g.coordinates.forEach(function (p) { holes.push(p[0]); });
    var world = [[-179.9, -85], [179.9, -85], [179.9, 85], [-179.9, 85], [-179.9, -85]];
    return {
      type: 'Feature', properties: {},
      geometry: { type: 'Polygon', coordinates: [world].concat(holes) }
    };
  }

  function addBoundaryLayers() {
    if (!map || !state.boundaryFeature) return;

    if (map.getSource(BOUNDARY_SRC)) {
      map.getSource(BOUNDARY_SRC).setData(state.boundaryFeature);
    } else {
      map.addSource(BOUNDARY_SRC, {
        type: 'geojson',
        data: state.boundaryFeature
      });
    }

    /* 區外遮罩（深藍半透明，蓋在影像/向量之上、邊界線之下） */
    var maskFeature = buildMaskFeature(state.boundaryFeature);
    if (map.getSource(MASK_SRC)) {
      map.getSource(MASK_SRC).setData(maskFeature);
    } else {
      map.addSource(MASK_SRC, { type: 'geojson', data: maskFeature });
    }
    if (!map.getLayer(MASK_LAYER)) {
      map.addLayer({
        id: MASK_LAYER,
        type: 'fill',
        source: MASK_SRC,
        paint: {
          'fill-color': '#0a1a2e',
          'fill-opacity': 0.62
        }
      });
    }

    if (!map.getLayer(BOUNDARY_FILL)) {
      map.addLayer({
        id: BOUNDARY_FILL,
        type: 'fill',
        source: BOUNDARY_SRC,
        paint: {
          'fill-color': '#3db8ff',
          'fill-opacity': 0.08
        }
      });
    }
    if (!map.getLayer(BOUNDARY_LINE)) {
      map.addLayer({
        id: BOUNDARY_LINE,
        type: 'line',
        source: BOUNDARY_SRC,
        paint: {
          'line-color': '#7dd3ff',
          'line-width': 2.6,
          'line-dasharray': [2, 1.2],
          'line-opacity': 0.95
        }
      });
    }
    raiseBoundary();
  }

  function computeBounds(feature) {
    var coords = [];
    function walk(c) {
      if (!c) return;
      if (typeof c[0] === 'number' && typeof c[1] === 'number') {
        coords.push(c);
        return;
      }
      for (var i = 0; i < c.length; i++) walk(c[i]);
    }
    walk(feature.geometry && feature.geometry.coordinates);
    if (!coords.length) return null;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < coords.length; i++) {
      var x = coords[i][0], y = coords[i][1];
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
    return [[minX, minY], [maxX, maxY]];
  }

  function findJialiFeature(geojson) {
    var features = (geojson && geojson.features) || [];
    var byCode = null;
    for (var i = 0; i < features.length; i++) {
      var p = features[i].properties || {};
      var code = String(p.TOWNCODE || p.towncode || '');
      var name = String(p.TOWNNAME || p.townname || '');
      // Name is authoritative; code is a stable fallback.
      if (name === TOWN_NAME) return features[i];
      if (!byCode && TOWN_CODES.indexOf(code) !== -1) byCode = features[i];
    }
    return byCode;
  }

  async function loadBoundary() {
    if (typeof topojson === 'undefined' || !topojson.feature) {
      throw new Error('topojson-client 未載入');
    }
    var res = await fetch(TOWNS_URL);
    if (!res.ok) throw new Error('邊界資料 HTTP ' + res.status);
    var topo = await res.json();
    if (!topo || !topo.objects || !topo.objects.towns) {
      throw new Error('towns-10t 格式不符');
    }
    var geo = topojson.feature(topo, topo.objects.towns);
    var feature = findJialiFeature(geo);
    if (!feature) throw new Error('找不到佳里區邊界（TOWNNAME=佳里區 / TOWNCODE=67000120）');
    state.boundaryFeature = feature;
    state.boundaryBounds = computeBounds(feature);
  }

  function onStyleReady() {
    state.styleReady = true;
    // The 25s timeout or an early network error may have shown the error overlay
    // before the style finally succeeded — clear it so a working map is not
    // permanently masked.
    elError.hidden = true;
    // Ensure Liberty building-3d exists and is controllable
    if (map.getLayer(BUILDING_LAYER_ID)) {
      setBuildingsVisible(state.buildingsOn);
    } else {
      // Fallback: recreate OpenMapTiles fill-extrusion if style variant missing the layer
      try {
        map.addLayer({
          id: BUILDING_LAYER_ID,
          type: 'fill-extrusion',
          source: 'openmaptiles',
          'source-layer': 'building',
          minzoom: 14,
          paint: {
            'fill-extrusion-base': ['get', 'render_min_height'],
            'fill-extrusion-color': 'hsl(35,8%,85%)',
            'fill-extrusion-height': ['get', 'render_height'],
            'fill-extrusion-opacity': 0.8
          }
        });
        setBuildingsVisible(state.buildingsOn);
      } catch (e) {
        console.warn('[jiali_3d] building-3d unavailable', e);
      }
    }
    addBoundaryLayers();
    setBasemap(state.basemap);
    hideLoading();
  }

  function initMap(camera) {
    if (typeof maplibregl === 'undefined') {
      showError('MapLibre GL JS 未載入（需要 unpkg maplibre-gl@5.6.0）。');
      return;
    }

    map = new maplibregl.Map({
      container: 'map',
      style: LIBERTY_STYLE,
      center: camera.center,
      zoom: camera.zoom,
      bearing: camera.bearing,
      pitch: camera.pitch,
      maxPitch: 85,
      attributionControl: false,
      hash: false,
      // Cooperative gestures optional; keep free pan for aerial viewer
      fadeDuration: reduceMotion ? 0 : 300
    });

    // The Liberty style's own sources already carry OpenFreeMap + OSM attribution,
    // so we do NOT pass customAttribution here (that duplicated the credit). Esri
    // imagery credit is supplied via its source's `attribution` when enabled.
    map.addControl(
      new maplibregl.AttributionControl({ compact: true }),
      'bottom-right'
    );

    /* 內建小羅盤關閉：改用右側常駐大指北針（#compass） */
    map.addControl(
      new maplibregl.NavigationControl({ visualizePitch: true, showCompass: false }),
      'bottom-right'
    );
    map.on('rotate', updateCompass);
    updateCompass();

    map.addControl(
      new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }),
      'bottom-right'
    );

    var loadTimer = setTimeout(function () {
      if (!state.styleReady) {
        showError('地圖樣式載入逾時。請確認可連線至 OpenFreeMap，然後重新整理。');
      }
    }, 25000);

    map.on('error', function (e) {
      var err = e && e.error;
      console.warn('[jiali_3d] map error', err);
      var msg = (err && (err.message || String(err))) || '';
      if (!state.styleReady && /style|fetch|network|ajax|load/i.test(msg)) {
        clearTimeout(loadTimer);
        showError('地圖樣式載入失敗：' + msg);
      }
    });

    map.once('load', function () {
      clearTimeout(loadTimer);
      onStyleReady();
    });

    // A genuine user gesture must stop the autoplay flyover. MapLibre's
    // dragstart `e.originalEvent` proved unreliable across versions (a real drag
    // left it undefined, so the flyover never stopped), so instead we listen for
    // raw pointer / touch / wheel input directly on the map canvas. The orbit
    // loop drives the camera with map.jumpTo(), which never dispatches these DOM
    // input events — so it will not stop itself (env: 環景只跑一幀 已修好且不回歸).
    var canvasEl = map.getCanvasContainer();
    ['pointerdown', 'touchstart', 'wheel'].forEach(function (ev) {
      canvasEl.addEventListener(ev, function () {
        if (state.flying) stopFlyover();
        /* 騎行/飛行不因誤觸中斷：動畫期間地圖操作已鎖定，僅「停止」鈕與 Esc 能結束 */
      }, { passive: true });
    });

    // 點地圖：騎行/飛行選點優先；一般模式浮現街景卡＋自動估算
    //（MapLibre 拖曳後不觸發 click，不會誤觸）
    map.on('click', function (e) {
      if (anim) return; /* 騎行/飛行中忽略點擊：貼地視角誤點地平線會蓋掉沿途街景卡 */
      if (navMode === 'ride-pick' || navMode === 'fly-pick') { handleNavPick(e.lngLat); return; }
      showSvCard(e.lngLat, queryBuildingInfo(e.point), queryRoadInfo(e.point));
    });
  }

  /* ── 建築估算：render_height（OSM/AI 推算）＋足跡外框約略寬深 ── */
  function bboxMeters(geom, lat) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    function walk(c) {
      if (!c) return;
      if (typeof c[0] === 'number') {
        if (c[0] < minX) minX = c[0];
        if (c[0] > maxX) maxX = c[0];
        if (c[1] < minY) minY = c[1];
        if (c[1] > maxY) maxY = c[1];
        return;
      }
      for (var i = 0; i < c.length; i++) walk(c[i]);
    }
    walk(geom && geom.coordinates);
    if (minX === Infinity) return null;
    return {
      w: (maxX - minX) * 111320 * Math.cos(lat * Math.PI / 180),
      d: (maxY - minY) * 111320
    };
  }

  function queryBuildingInfo(point) {
    if (!map || !state.styleReady || !map.getLayer(BUILDING_LAYER_ID)) return null;
    try {
      var fs = map.queryRenderedFeatures(point, { layers: [BUILDING_LAYER_ID] });
      var best = null, h = null;
      for (var i = 0; i < fs.length; i++) {
        var rh = fs[i].properties && +fs[i].properties.render_height;
        if (rh && (h == null || rh > h)) { h = rh; best = fs[i]; }
      }
      if (h == null) return null;
      // 圖磚邊緣的建築足跡可能被切到，寬深僅供參考
      var lat = map.unproject(point).lat;
      var box = best.geometry ? bboxMeters(best.geometry, lat) : null;
      return { h: h, box: box };
    } catch (_) { return null; }
  }

  /* ── 路寬估算：從向量圖磚道路等級推估（非實測）。
     衛星模式會隱藏樣式內建道路線，因此鋪兩層幾乎透明的查詢專用線
     （加在影像之上，opacity 0.01 肉眼不可見但可被 queryRenderedFeatures 命中） ── */
  var ROADQ_LINE = 'roadq-line';
  var ROADQ_NAME = 'roadq-name';
  var ROAD_CLASS_INFO = {
    motorway: { label: '國道/高速公路', w: 25 },
    motorway_link: { label: '國道聯絡道', w: 12 },
    trunk: { label: '快速道路', w: 18 },
    trunk_link: { label: '快速道路聯絡道', w: 10 },
    primary: { label: '主要道路', w: 15 },
    primary_link: { label: '主要道路聯絡道', w: 10 },
    secondary: { label: '次要道路', w: 12 },
    secondary_link: { label: '次要道路聯絡道', w: 10 },
    tertiary: { label: '一般道路', w: 10 },
    tertiary_link: { label: '一般道路聯絡道', w: 8 },
    minor: { label: '街道', w: 8 },
    residential: { label: '住宅街道', w: 8 },
    unclassified: { label: '街道', w: 8 },
    living_street: { label: '生活街道', w: 6 },
    busway: { label: '公車專用道', w: 8 },
    service: { label: '服務道路/巷弄', w: 5 },
    pedestrian: { label: '行人徒步區', w: 4 },
    track: { label: '產業道路', w: 4 },
    path: { label: '小徑', w: 2 }
  };
  // 鐵軌/纜車/渡輪等非道路，命中時跳過不誤報路寬
  var ROAD_CLASS_SKIP = { rail: 1, transit: 1, cable_car: 1, monorail: 1, funicular: 1, ferry: 1, aerialway: 1 };

  function ensureRoadQueryLayers() {
    if (!map.getSource('openmaptiles')) return;
    if (!map.getLayer(ROADQ_LINE)) {
      map.addLayer({
        id: ROADQ_LINE,
        type: 'line',
        source: 'openmaptiles',
        'source-layer': 'transportation',
        paint: { 'line-opacity': 0.01, 'line-width': 12, 'line-color': '#000' }
      });
    }
    if (!map.getLayer(ROADQ_NAME)) {
      map.addLayer({
        id: ROADQ_NAME,
        type: 'line',
        source: 'openmaptiles',
        'source-layer': 'transportation_name',
        paint: { 'line-opacity': 0.01, 'line-width': 12, 'line-color': '#000' }
      });
    }
  }

  function queryRoadInfo(point) {
    if (!map || !state.styleReady) return null;
    try {
      var layers = [];
      if (map.getLayer(ROADQ_NAME)) layers.push(ROADQ_NAME);
      if (map.getLayer(ROADQ_LINE)) layers.push(ROADQ_LINE);
      if (!layers.length) return null;
      // 以點擊點 ±12px 方框查詢，容錯高（細路/南北向斜視角都點得到）
      var box = [
        [point.x - 12, point.y - 12],
        [point.x + 12, point.y + 12]
      ];
      var fs = map.queryRenderedFeatures(box, { layers: layers });
      var name = '', cls = '', anyRoad = false;
      for (var i = 0; i < fs.length; i++) {
        var p = fs[i].properties || {};
        var c = p.class || '';
        if (ROAD_CLASS_SKIP[c]) continue;
        anyRoad = true;
        if (!name && (p['name:zh'] || p.name)) name = p['name:zh'] || p.name;
        if (!cls && ROAD_CLASS_INFO[c]) cls = c;
      }
      if (!anyRoad) return null;
      // 等級不在對照表也至少給通用估算，不再整條沉默
      var info = ROAD_CLASS_INFO[cls] || { label: '道路', w: 8 };
      return { name: name, label: info.label, width: info.w };
    } catch (_) { return null; }
  }

  /* ── 街景卡：帶方向錐的藍點標記＋縮圖（拖曳旋轉、點擊放大） ──
     省 API 訣竅：圖片一律用 metadata（免費）回的 pano_id 請求，附近點擊共用同一顆
     全景球 → URL 相同 → 瀏覽器/CF 邊緣快取直接命中，不重複計費 */
  var svLngLat = null;
  var svMarker = null;
  var svToken = 0; // 連點多處時只認最後一次的 metadata 回應
  var svPano = null;
  var svHeading = null; // 0-359；初始 = 從全景球拍攝點指向點選處的方位角

  function bearingDeg(from, to) { // from/to: {lat,lng}
    var f1 = from.lat * Math.PI / 180;
    var f2 = to.lat * Math.PI / 180;
    var dl = (to.lng - from.lng) * Math.PI / 180;
    var y = Math.sin(dl) * Math.cos(f2);
    var x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  /* 標記＝藍點＋視野錐（像 Google 小黃人）：rotation 隨 svHeading，rotationAlignment
     取 map 讓錐形跟地圖座標系一起轉，不受地圖 bearing 影響方位正確性 */
  function makeSvMarkerEl() {
    var el = document.createElement('div');
    el.style.cssText = 'width:68px;height:68px;pointer-events:none;';
    el.innerHTML =
      '<svg width="68" height="68" viewBox="0 0 68 68">' +
        '<path d="M34 34 L15.6 8.4 A32 32 0 0 1 52.4 8.4 Z"' +
          ' fill="rgba(61,184,255,.5)" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>' +
        '<circle cx="34" cy="34" r="8.5" fill="#3db8ff" stroke="#fff" stroke-width="3"/>' +
      '</svg>';
    return el;
  }

  function updateMarkerRotation() {
    if (svMarker) svMarker.setRotation(svHeading != null ? svHeading : 0);
  }

  function svImgUrl(w, h) {
    var q = SV_PROXY + '?mode=img&size=' + w + 'x' + h;
    if (svPano) {
      q += '&pano=' + encodeURIComponent(svPano);
      if (svHeading != null) q += '&heading=' + svHeading;
    } else if (svLngLat) {
      // fallback（metadata 失敗時）：傳 location，Google 自動把鏡頭朝向點選處
      q += '&location=' + svLngLat.lat + ',' + svLngLat.lng;
    }
    return q;
  }

  /* ── 街景內移動軌跡（暫存於記憶體，重新整理即消失） ── */
  var TRAIL_SRC = 'sv-trail';
  var TRAIL_LAYER = 'sv-trail-line';
  var TRAIL_ARROWS = 'sv-trail-arrows';
  var TRAIL_ENDS = 'sv-trail-ends';
  var trailSegs = []; // Array<Array<[lng,lat]>>，每次開燈箱新起一段

  function ensureTrailArrowImage() {
    if (map.hasImage('trail-arrow')) return;
    // 以 canvas 畫箭頭圖示（不靠字型 glyph，離線/任何樣式都保證顯示）
    var c = document.createElement('canvas');
    c.width = 24; c.height = 24;
    var ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(4, 5); ctx.lineTo(20, 12); ctx.lineTo(4, 19); ctx.closePath();
    ctx.fillStyle = '#00e5ff';
    ctx.strokeStyle = 'rgba(0,20,30,.85)';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    map.addImage('trail-arrow', ctx.getImageData(0, 0, 24, 24), { pixelRatio: 2 });
  }

  function ensureTrailLayer() {
    if (!map.getSource(TRAIL_SRC)) {
      map.addSource(TRAIL_SRC, {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });
    }
    ensureTrailArrowImage();
    if (!map.getLayer(TRAIL_LAYER)) {
      map.addLayer({
        id: TRAIL_LAYER,
        type: 'line',
        source: TRAIL_SRC,
        filter: ['==', '$type', 'LineString'],
        paint: { 'line-color': '#00e5ff', 'line-width': 3.5, 'line-opacity': 0.9, 'line-dasharray': [1, 1.3] }
      });
    }
    if (!map.getLayer(TRAIL_ARROWS)) {
      // 沿線方向箭頭（座標順序＝行進方向）
      map.addLayer({
        id: TRAIL_ARROWS,
        type: 'symbol',
        source: TRAIL_SRC,
        filter: ['==', '$type', 'LineString'],
        layout: {
          'symbol-placement': 'line',
          'symbol-spacing': 55,
          'icon-image': 'trail-arrow',
          'icon-size': 0.95,
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
          'icon-rotation-alignment': 'map',
          'icon-pitch-alignment': 'map'
        }
      });
    }
    if (!map.getLayer(TRAIL_ENDS)) {
      // 每段起點綠、迄點紅
      map.addLayer({
        id: TRAIL_ENDS,
        type: 'circle',
        source: TRAIL_SRC,
        filter: ['==', '$type', 'Point'],
        paint: {
          'circle-radius': 6,
          'circle-color': ['match', ['get', 'kind'], 'start', '#2ecc71', '#ff5e57'],
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 2
        }
      });
    }
  }

  function updateTrail() {
    if (!map || !map.getSource(TRAIL_SRC)) return;
    var feats = [];
    for (var i = 0; i < trailSegs.length; i++) {
      var s = trailSegs[i];
      if (s.length < 2) continue;
      feats.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: s } });
      feats.push({ type: 'Feature', properties: { kind: 'start' }, geometry: { type: 'Point', coordinates: s[0] } });
      feats.push({ type: 'Feature', properties: { kind: 'end' }, geometry: { type: 'Point', coordinates: s[s.length - 1] } });
    }
    map.getSource(TRAIL_SRC).setData({ type: 'FeatureCollection', features: feats });
  }

  function trailStart() {
    if (map && state.styleReady) ensureTrailLayer();
    trailSegs.push([]);
  }

  function trailAppend(lng, lat) {
    var seg = trailSegs[trailSegs.length - 1];
    if (!seg) { seg = []; trailSegs.push(seg); }
    var last = seg[seg.length - 1];
    if (last) {
      var dm = Math.abs(lat - last[1]) * 111320 +
               Math.abs(lng - last[0]) * 111320 * Math.cos(lat * Math.PI / 180);
      if (dm < 1.5) return; // 原地微晃不記
    }
    seg.push([lng, lat]);
    updateTrail();
  }

  /* 互動式街景用的前端 key：向 /api/sv 取一次（''=未設定→逐層退化） */
  var embedKey = null;
  function getEmbedKey() {
    if (embedKey !== null) return Promise.resolve(embedKey);
    return fetch(SV_PROXY + '?mode=embedkey')
      .then(function (r) { return r.json(); })
      .then(function (d) { embedKey = (d && d.key) || ''; return embedKey; })
      .catch(function () { embedKey = ''; return embedKey; });
  }

  /* ── 放大檢視三層 fallback：JS API 全景（走動/轉向同步回地圖）→ Embed iframe → 靜態圖 ── */
  var pano = null;
  var panoAuthFailed = false;
  var mapsJsPromise = null;

  // key 未開通 Maps JavaScript API 時 Google 會呼叫這個全域 callback → 退 iframe
  window.gm_authFailure = function () {
    panoAuthFailed = true;
    if (!elSvLightbox.hidden && !elSvPano.hidden) {
      elSvPano.hidden = true;
      getEmbedKey().then(function (k) {
        /* 回呼時燈箱可能已被關閉：不要在背景載入 iframe */
        if (k && !elSvLightbox.hidden) showIframeLightbox(k);
      });
    }
  };

  function loadMapsJs(key) {
    if (window.google && window.google.maps && window.google.maps.StreetViewPanorama) {
      return Promise.resolve(true);
    }
    if (mapsJsPromise) return mapsJsPromise;
    mapsJsPromise = new Promise(function (resolve) {
      window.__svPanoReady = function () { resolve(true); };
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
        '&v=weekly&loading=async&callback=__svPanoReady';
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
    return mapsJsPromise;
  }

  function onPanoMove() {
    if (!pano || elSvLightbox.hidden) return; /* 燈箱已關：不再同步回地圖 */
    var p = pano.getPosition();
    if (!p) return;
    svLngLat = { lat: p.lat(), lng: p.lng() };
    if (svMarker) svMarker.setLngLat([svLngLat.lng, svLngLat.lat]);
    elSvCoord.textContent = '📍 ' + svLngLat.lat.toFixed(5) + ', ' + svLngLat.lng.toFixed(5);
    trailAppend(svLngLat.lng, svLngLat.lat);
  }

  function onPanoPov() {
    if (!pano || elSvLightbox.hidden) return; /* 燈箱已關：不再同步回地圖 */
    var pov = pano.getPov();
    svHeading = Math.round(((pov.heading % 360) + 360) % 360);
    updateMarkerRotation();
  }

  function showPanoLightbox() {
    elSvPano.hidden = false;
    elSvLightboxFrame.hidden = true;
    elSvLightboxImg.hidden = true;
    var povH = svHeading != null ? svHeading : 0;
    if (!pano) {
      pano = new google.maps.StreetViewPanorama(elSvPano, {
        pov: { heading: povH, pitch: 0 },
        motionTracking: false,
        addressControl: false,
        fullscreenControl: true
      });
      pano.addListener('position_changed', onPanoMove);
      pano.addListener('pov_changed', onPanoPov);
      pano.addListener('pano_changed', function () { if (pano) svPano = pano.getPano() || svPano; });
    }
    if (svPano) pano.setPano(svPano);
    else if (svLngLat) pano.setPosition({ lat: svLngLat.lat, lng: svLngLat.lng });
    pano.setPov({ heading: povH, pitch: 0 });
    trailStart();
    setTimeout(function () { // hidden→shown 需重新量尺寸
      if (window.google && google.maps && google.maps.event) google.maps.event.trigger(pano, 'resize');
    }, 80);
  }

  function showIframeLightbox(k) {
    var src = 'https://www.google.com/maps/embed/v1/streetview?key=' + encodeURIComponent(k);
    if (svPano) src += '&pano=' + encodeURIComponent(svPano);
    else if (svLngLat) src += '&location=' + svLngLat.lat + ',' + svLngLat.lng;
    if (svHeading != null) src += '&heading=' + svHeading;
    elSvLightboxFrame.src = src;
    elSvLightboxFrame.hidden = false;
    elSvPano.hidden = true;
    elSvLightboxImg.hidden = true;
  }

  function showStaticLightbox() {
    elSvLightboxImg.src = svImgUrl(640, 400);
    elSvLightboxImg.hidden = false;
    elSvPano.hidden = true;
    elSvLightboxFrame.hidden = true;
  }

  var svLbSeq = 0; /* 開燈箱世代序號：關閉後作廢在途的 embedkey/loadMapsJs 回呼，防燈箱自己重開 */

  function openSvLightbox() {
    var seq = ++svLbSeq;
    // 燈箱右上「Google 地圖 ↗」：目前位置/方向的完整街景
    var gUrl = 'https://www.google.com/maps/@?api=1&map_action=pano';
    if (svPano) gUrl += '&pano=' + encodeURIComponent(svPano);
    if (svLngLat) gUrl += '&viewpoint=' + svLngLat.lat + ',' + svLngLat.lng;
    if (svHeading != null) gUrl += '&heading=' + svHeading;
    elSvLightboxOpen.href = gUrl;

    getEmbedKey().then(function (k) {
      if (seq !== svLbSeq) return;
      elSvLightbox.hidden = false;
      if (!k) { showStaticLightbox(); return; }
      loadMapsJs(k).then(function (ok) {
        if (seq !== svLbSeq) return;
        if (ok && !panoAuthFailed &&
            window.google && window.google.maps && window.google.maps.StreetViewPanorama) {
          showPanoLightbox();
        } else {
          showIframeLightbox(k);
        }
      });
    });
  }

  function closeSvLightbox() {
    svLbSeq++;
    var wasOpen = !elSvLightbox.hidden;
    elSvLightbox.hidden = true;
    elSvLightboxFrame.src = 'about:blank'; // 停掉 iframe，避免背景繼續吃資源
    if (wasOpen && !elSvThumb.hidden && svPano) {
      // 縮圖跳到街景裡最後走到的位置與方向；方位量化 15° 提高快取命中
      if (svHeading != null) svHeading = Math.round(svHeading / 15) * 15 % 360;
      updateMarkerRotation();
      elSvThumb.src = svImgUrl(300, 180);
    }
  }

  /* 縮圖左右拖曳＝滑順旋轉方向：拖曳中只轉地圖上的視野錐（免費、即時），
     放手才量化 15° 載一張新縮圖（1 次快取請求） */
  var thumbDrag = { active: false, moved: false, startX: 0, startHeading: 0 };

  function onThumbDown(ev) {
    if (!svPano) return;
    thumbDrag.active = true;
    thumbDrag.moved = false;
    thumbDrag.startX = ev.clientX;
    thumbDrag.startHeading = svHeading != null ? svHeading : 0;
    elSvThumb.setPointerCapture(ev.pointerId);
  }

  function onThumbMove(ev) {
    if (!thumbDrag.active) return;
    var dx = ev.clientX - thumbDrag.startX;
    if (!thumbDrag.moved && Math.abs(dx) > 4) {
      thumbDrag.moved = true;
      elSvThumb.style.cursor = 'ew-resize';
    }
    if (!thumbDrag.moved) return;
    svHeading = Math.round(((thumbDrag.startHeading + dx * 0.8) % 360 + 360) % 360);
    updateMarkerRotation();
  }

  function onThumbUp() {
    if (!thumbDrag.active) return;
    thumbDrag.active = false;
    elSvThumb.style.cursor = '';
    if (thumbDrag.moved) {
      svHeading = Math.round((svHeading || 0) / 15) * 15 % 360;
      updateMarkerRotation();
      elSvThumb.src = svImgUrl(300, 180);
    }
  }

  function showSvCard(lngLat, bldg, road) {
    svLngLat = lngLat;
    elSvCoord.textContent = '📍 ' + lngLat.lat.toFixed(5) + ', ' + lngLat.lng.toFixed(5);
    if (bldg) {
      var txt;
      if (bldg.h === 5) {
        // OpenMapTiles 對 OSM 無 height/levels 標籤的建築一律給預設 5m，非真實資料
        txt = '🏢 樓層未登錄（圖資預設 5m）';
      } else {
        var floors = Math.max(1, Math.round(bldg.h / 3)); // 每層約 3 m 估算
        txt = '🏢 高約 ' + Math.round(bldg.h) + ' m（≈' + floors + ' 樓）';
      }
      if (bldg.box && bldg.box.w > 1 && bldg.box.d > 1) {
        txt += '・佔地約 ' + Math.round(bldg.box.w) + '×' + Math.round(bldg.box.d) + ' m';
      }
      elSvBldg.textContent = txt;
      elSvBldg.hidden = false;
    } else {
      elSvBldg.hidden = true;
    }
    if (road) {
      elSvRoad.textContent = '🛣️ ' + (road.name ? road.name + '（' + road.label + '）' : road.label) +
        ' 路寬約 ' + road.width + ' m（依道路等級估算）';
      elSvRoad.hidden = false;
    } else {
      elSvRoad.hidden = true;
    }
    elSvCard.hidden = false;
    if (!svMarker) {
      svMarker = new maplibregl.Marker({
        element: makeSvMarkerEl(),
        rotationAlignment: 'map',
        pitchAlignment: 'map'
      });
    }
    svMarker.setLngLat(lngLat).addTo(map);
    updateMarkerRotation();

    // 縮圖：先查 metadata（免費）確認覆蓋，無街景就不發計費的圖片請求
    var t = ++svToken;
    elSvThumb.hidden = true;
    elSvThumb.removeAttribute('src');
    elSvNopano.hidden = true;
    svPano = null;
    svHeading = null;
    fetch(SV_PROXY + '?mode=meta&location=' + lngLat.lat + ',' + lngLat.lng)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (t !== svToken) return;
        if (d && d.status === 'OK') {
          svPano = d.pano_id || null;
          if (svPano && d.location) {
            // 方位量化到 15° 一格：初始即面向點選處，快取命中率高
            svHeading = Math.round(bearingDeg(d.location, lngLat) / 15) * 15 % 360;
            updateMarkerRotation();
          }
          elSvThumb.src = svImgUrl(300, 180); // 2x 尺寸縮小顯示，高解析
          elSvThumb.hidden = false;
        } else {
          elSvNopano.hidden = false;
        }
      })
      .catch(function () {
        // metadata 失敗（斷線等）→ 直接試載縮圖，無覆蓋時 Google 回灰底佔位圖
        if (t !== svToken) return;
        elSvThumb.src = svImgUrl(300, 180);
        elSvThumb.hidden = false;
      });
  }

  function hideSvCard() {
    elSvCard.hidden = true;
    closeSvLightbox();
    svLngLat = null;
    svPano = null;
    svHeading = null;
    svToken++;
    if (svMarker) svMarker.remove();
    // 軌跡保留（暫存參考，重新整理才消失）
  }

  /* ══════════ 騎行/飛行預覽 ══════════
     騎行：離線路網 A*（route_graph.js 懶載）→ 機車沿路線騎行、相機跟隨、沿途街景同步
     飛行：兩點直線，小飛機高空視角飛越（動畫用 setInterval，背景分頁也能繼續） */
  var routeGraphPromise = null;
  function ensureRouteGraph() {
    if (typeof ROUTE_GRAPH !== 'undefined') return Promise.resolve(true);
    if (routeGraphPromise) return routeGraphPromise;
    routeGraphPromise = new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'route_graph.js';
      s.onload = function () { resolve(typeof ROUTE_GRAPH !== 'undefined'); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);

    elSvThumb.addEventListener('pointermove', onThumbMove);
    elSvThumb.addEventListener('pointerup', onThumbUp);
    elSvThumb.addEventListener('pointercancel', onThumbUp);
    elSvThumb.addEventListener('click', function () {
      if (thumbDrag.moved) { thumbDrag.moved = false; return; } // 拖曳結尾的 click 不開燈箱
      if (!svLngLat) return;
      openSvLightbox();
    });
    btnSvLightboxClose.addEventListener('click', closeSvLightbox);
    elSvLightbox.addEventListener('click', function (e) {
      if (e.target === elSvLightbox || e.target === elSvLightboxImg) closeSvLightbox();
    });

    // Keyboard: 1–7 quick actions when not typing in inputs
    document.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
        return;
      }
      if (e.key === 'Escape' && !elSvLightbox.hidden) {
        closeSvLightbox();
        return;
      }
      if (e.key === 'Escape' && (navMode || anim || !elRideNote.hidden)) {
        exitNavMode();
        return;
      }
      if (e.key === 'Escape' && !elSvCard.hidden) {
        hideSvCard();
        return;
      }
      if (e.key === 'Escape' && state.flying) {
        stopFlyover();
        return;
      }
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      switch (e.key) {
        case '1':
          e.preventDefault();
          window.location.href = 'jialie_gis_v6.html';
          break;
        case '2':
          e.preventDefault();
          setBasemap(state.basemap === 'satellite' ? 'vector' : 'satellite');
          break;
        case '3':
          e.preventDefault();
          goCityCenter();
          break;
        case '6':
          e.preventDefault();
          toggleFlyover();
          break;
        case '7':
          e.preventDefault();
          setBuildingsVisible(!state.buildingsOn);
          break;
        case '8':
          e.preventDefault();
          setSvLinesVisible(!state.svLinesOn);
          break;
        default:
          break;
      }
    });

    if (reduceMotion) {
      btnFly.title = '已啟用減少動態：環景改為回到市中心靜態視角';
    }
  }

  async function main() {
    showLoading('正在準備地圖與佳里區邊界…');
    wireUi();
    var camera = readCameraFromQuery();

    try {
      // Load boundary in parallel with map style network; map init first for faster paint
      initMap(camera);
      await loadBoundary();
      if (map) {
        if (map.isStyleLoaded()) {
          addBoundaryLayers();
        } else {
          map.once('load', function () {
            addBoundaryLayers();
          });
        }
      }
    } catch (err) {
      console.error('[jiali_3d]', err);
      // Map may still work without boundary; only hard-fail if map library missing
      if (!map) {
        showError((err && err.message) || '初始化失敗');
        return;
      }
      // Soft warning in loading panel then hide if map already ready
      if (state.styleReady) {
        hideLoading();
      }
      var note = document.getElementById('source-note');
      if (note) {
        note.innerHTML +=
          ' <span style="color:#ff8a80">邊界載入失敗：' +
          String((err && err.message) || '未知錯誤').replace(/</g, '&lt;') +
          '。</span>';
      }
    }
  }

  main();
})();
</script>
</body>
</html>
