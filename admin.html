<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>佳里 GIS — 資料管理 v1.0.4</title>
<style>
* { box-sizing: border-box; }
:root {
  --blue: #1b4f72; --blue-dk: #0f2d42; --blue-lt: #d6eaf8;
  --bg: #f4f6f8; --surface: #fff; --border: #d6dbe2;
  --text: #1a202c; --text2: #4a5568; --text3: #8a96a3;
  --ok: #27ae60; --danger: #c0392b; --warn: #c0550a;
  --radius: 10px;
}
body { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; margin:0; background:var(--bg); color:var(--text); font-size:14px; }
header { background:var(--blue); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
header h1 { margin:0; font-size:16px; font-weight:600; }
header .ver { font-size:11px; opacity:.7; }
header .spacer { flex:1; }
header button { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
header button:hover { background:rgba(255,255,255,.25); }

#login { max-width:340px; margin:80px auto; background:var(--surface); padding:32px 28px; border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,.08); }
#login h2 { margin:0 0 16px; font-size:18px; color:var(--blue); }
#login p { color:var(--text2); margin:0 0 20px; font-size:13px; }
#login input { width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--border); border-radius:6px; }
#login button { width:100%; margin-top:14px; padding:10px; background:var(--blue); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; }
#login button:hover { background:var(--blue-dk); }
#login .msg { margin-top:10px; font-size:12px; color:var(--danger); min-height:16px; }
#login .back-btn { background:none; color:var(--text2); border:1px solid var(--border); font-weight:600; }
#login .back-btn:hover { background:var(--blue-lt); color:var(--blue); }

#main { display:none; padding:0; }
.tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); padding:0 20px; overflow-x:auto; }
.tab { padding:12px 18px; cursor:pointer; border-bottom:3px solid transparent; font-size:13px; white-space:nowrap; color:var(--text2); }
.tab:hover { background:var(--blue-lt); }
.tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:600; }

.toolbar { background:var(--surface); padding:12px 20px; border-bottom:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.toolbar input[type="search"] { flex:1; min-width:200px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; }
.toolbar select { padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:#fff; }
.toolbar button { padding:8px 12px; background:#fff; color:var(--blue); border:1px solid var(--blue); border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; }
.toolbar button:hover { background:var(--blue-lt); }
.toolbar button.primary { background:var(--blue); color:#fff; }
.toolbar button.primary:hover { background:var(--blue-dk); }
.toolbar button.danger { color:var(--danger); border-color:var(--danger); }
.toolbar button.danger:hover { background:#fef0ee; }

.table-wrap { padding:0 20px 20px; }
table { width:100%; border-collapse:collapse; background:var(--surface); margin-top:12px; border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04); }
th { background:var(--blue-lt); color:var(--blue); text-align:left; padding:10px 12px; font-size:12px; font-weight:600; border-bottom:1px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fafbfc; }
td.actions { white-space:nowrap; }
td.actions button { padding:4px 10px; margin-right:4px; font-size:11px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer; }
td.actions button:hover { background:var(--blue-lt); border-color:var(--blue); color:var(--blue); }
td.actions button.del:hover { background:#fef0ee; border-color:var(--danger); color:var(--danger); }
.badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; }
.badge.admin { background:#fef0ee; color:var(--danger); }
.badge.seed { background:#e9ecef; color:var(--text3); }

.empty { padding:60px 20px; text-align:center; color:var(--text3); font-size:13px; }
.pager { display:flex; gap:8px; justify-content:center; padding:12px; align-items:center; font-size:12px; color:var(--text2); }
.pager button { padding:5px 12px; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; }
.pager button:disabled { opacity:.4; cursor:not-allowed; }

.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:var(--radius); padding:24px; min-width:380px; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.2); }
.modal h3 { margin:0 0 16px; font-size:16px; color:var(--blue); }
.modal .field { margin-bottom:12px; }
.modal .field label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; font-weight:600; }
.modal .field input, .modal .field textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; }
.modal .field textarea { min-height:60px; resize:vertical; }
.modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .actions button { padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; border:1px solid var(--border); background:#fff; }
.modal .actions button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }

.toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:8px; color:#fff; font-size:13px; font-weight:600; z-index:2000; box-shadow:0 4px 16px rgba(0,0,0,.25); display:none; }
.toast.ok { background:var(--ok); }
.toast.err { background:var(--danger); }

@media (max-width:640px) {
  .toolbar { padding:10px; }
  .table-wrap { padding:0 10px 10px; }
  th, td { padding:8px 6px; font-size:12px; }
  .modal { min-width:280px; max-width:94vw; padding:18px; }
}
</style>
</head>
<body>

<div id="login">
  <h2>佳里 GIS 資料管理</h2>
  <p>請輸入 PIN 密碼</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
  <button onclick="login()">登入</button>
  <div class="msg" id="loginMsg"></div>
  <button class="back-btn" type="button" onclick="goBackToGis()">← 回上一頁</button>
</div>

<div id="main">
  <header>
    <h1>佳里 GIS 資料管理</h1>
    <span class="ver">v1.0.4</span>
    <span class="spacer"></span>
    <button onclick="window.open('/','_blank')">前往 GIS 主頁</button>
    <button onclick="logout()">登出</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="搜尋關鍵字 (按 Enter)">
    <select id="sourceFilter">
      <option value="">全部來源</option>
      <option value="admin">僅管理者編輯</option>
      <option value="seed">僅原始 seed</option>
    </select>
    <button class="primary" onclick="openCreateModal()">+ 新增</button>
    <button onclick="openImportModal()">匯入 CSV</button>
    <button onclick="doExport('csv')">匯出 CSV</button>
    <button onclick="doExport('json')">匯出 JSON</button>
    <button id="exportOverlayBtn" onclick="doExport('csv', true)" style="display:none">匯出有整編紀錄</button>
  </div>
  <div class="table-wrap">
    <div id="fluBar" style="display:none;background:var(--surface);padding:12px;border-radius:var(--radius);margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)"></div>
    <table id="dataTable">
      <thead></thead>
      <tbody></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const TABLES = {
  old_to_new: {
    label: '舊新門牌對照',
    pk: 'old_addr',
    cols: [
      { key:'old_addr', label:'舊址', required:true },
      { key:'new_addr', label:'新址', required:true },
      { key:'notes',    label:'備註' }
    ]
  },
  door_db: {
    label: '門牌資料庫 DOOR_DB',
    pk: 'id',
    cols: [
      { key:'id',    label:'ID', readonly:true },
      { key:'lat',   label:'緯度', type:'number', step:'0.0000001', required:true },
      { key:'lng',   label:'經度', type:'number', step:'0.0000001', required:true },
      { key:'addr',  label:'地址', required:true },
      { key:'notes', label:'備註' }
    ],
    supportsOverlayExport: true
  },
  village_info: {
    label: '里別資訊',
    pk: 'village',
    cols: [
      { key:'village',     label:'里名', required:true },
      { key:'nurse',       label:'護理師' },
      { key:'head_name',   label:'里長姓名' },
      { key:'tel',         label:'市話' },
      { key:'mobile',      label:'手機' },
      { key:'address',     label:'里辦地址' },
      { key:'pop_total',   label:'總人口', type:'number' },
      { key:'pop_male',    label:'男', type:'number' },
      { key:'pop_female',  label:'女', type:'number' },
      { key:'pop_young',   label:'幼 0-14', type:'number' },
      { key:'pop_adult',   label:'壯 15-64', type:'number' },
      { key:'pop_old',     label:'老 65+', type:'number' },
      { key:'ab_total',    label:'原住民合計', type:'number' },
      { key:'ab_plain',    label:'平地原住民', type:'number' },
      { key:'ab_mountain', label:'山地原住民', type:'number' },
      { key:'prev_care',   label:'預防保健 (JSON)', textarea:true },
      { key:'notes',       label:'備註' }
    ]
  },
  kv_misc: {
    label: '雜項 KV',
    pk: 'key',
    cols: [
      { key:'key',      label:'鍵', required:true },
      { key:'category', label:'分類' },
      { key:'value',    label:'值 (JSON 或文字)', textarea:true },
      { key:'notes',    label:'備註' }
    ]
  },
  flu_contract: { label: '💉 流感合約', custom: true }
};

/* ══ 💉 流感合約分頁（v1.0.3）══
   存於 kv_misc：key='flu:院所名'、category='flu'、value='af,ac,vf,vc' 逗號碼（空=未參加）。
   主頁 /api/overlay 公開帶回後覆寫 FACILITY_DB 的 flu 標記。
   ⚠️ key 的院所名必須與主頁 FACILITY_DB 名稱一字不差，才會套用到地圖。 */
const FLU_TYPES = [['af','流感抗病毒'],['ac','新冠抗病毒'],['vf','流感疫苗'],['vc','新冠疫苗']];
const FLU_DEFAULTS = [
  ["佳里衛生所","af,ac,vf,vc"],
  ["奇美醫療財團法人佳里奇美醫院","af,ac,vf,vc"],
  ["馬博榮婦產專科診所","vf,vc"],
  ["黃逸仁診所","af"],
  ["佳安診所","af,ac,vf,vc"],
  ["新生診所","vf,vc"],
  ["以琳內科診所","af,vf"],
  ["楊惠芬婦產科診所",""],
  ["黃清相診所","af,ac,vf,vc"],
  ["鴻慶診所",""],
  ["金石小兒科診所","vf"],
  ["賴建利小兒科診所",""],
  ["黃永裕家醫科診所",""],
  ["葉佳霖診所",""],
  ["劉亞伯耳鼻喉科診所","af"],
  ["泰好復健科診所",""],
  ["佳元診所",""],
  ["立新診所","af"],
  ["張松盛小兒科診所",""],
  ["人人診所",""],
  ["宏和診所",""],
  ["蘇稔然內科診所",""],
  ["朝圍診所",""],
  ["光復診所",""],
  ["吳小兒科診所",""],
  ["謝樂偉眼科診所","ac,vf,vc"],
  ["吳志昶耳鼻喉科診所","af"],
  ["凃尚言皮膚科",""],
  ["鍾宏銘皮膚科診所",""],
  ["汪骨科診所",""],
  ["洪骨科診所",""],
  ["茗亮楊宗茗復健科診所",""],
  ["明如身心診所",""],
  ["凱禾診所","vf,vc"],
  ["陳內兒科診所",""],
  ["李芳輝內小兒科診所","vf"],
  ["王順珍外婦產科診所",""],
  ["陳婦產科診所",""],
  ["佳里吳婦產科診所",""],
  ["莊嘉斐眼科診所",""],
  ["顏忠信眼科診所",""],
  ["信明眼科診所",""]
];
let _fluRows = [];   /* [{key,name,notes,set:Set,orig:string}] */

function _fluCanon(set){ return ['af','ac','vf','vc'].filter(c => set.has(c)).join(','); }

async function renderFluPanel() {
  const thead = document.querySelector('#dataTable thead');
  const tbody = document.querySelector('#dataTable tbody');
  document.getElementById('pager').innerHTML = '';
  thead.innerHTML = '<tr><th>醫事機構</th>' + FLU_TYPES.map(t=>`<th style="text-align:center">${t[1]}</th>`).join('') + '<th>狀態</th><th>操作</th></tr>';
  tbody.innerHTML = '<tr><td colspan="7" class="empty">載入中…</td></tr>';
  const res = await fetch('/api/table/kv_misc?limit=500&offset=0&q=' + encodeURIComponent('flu:'));
  if (res.status === 401) { location.reload(); return; }
  const data = await res.json();
  _fluRows = (data.rows || [])
    .filter(r => String(r.key || '').startsWith('flu:'))
    .map(r => {
      const set = new Set(String(r.value || '').split(',').map(x => x.trim()).filter(c => ['af','ac','vf','vc'].includes(c)));
      return { key: r.key, name: r.key.slice(4), notes: r.notes || '', set, orig: _fluCanon(set) };
    })
    .sort((a, b) => a.set.size - b.set.size || a.name.localeCompare(b.name, 'zh-Hant'));
  renderFluBar();
  if (!_fluRows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">尚未初始化 — 請按上方「⚡ 初始化 115 年名冊」把 42 家院所寫入資料庫</td></tr>';
    return;
  }
  tbody.innerHTML = _fluRows.map((r, i) => `<tr id="flu-tr-${i}">
    <td>${esc(r.name)}</td>
    ${FLU_TYPES.map(t => `<td style="text-align:center"><input type="checkbox" data-i="${i}" data-code="${t[0]}" ${r.set.has(t[0]) ? 'checked' : ''} style="width:17px;height:17px;cursor:pointer"></td>`).join('')}
    <td id="flu-st-${i}">${fluStatus(r.set)}</td>
    <td class="actions"><button class="del" data-delkey="${esc(r.key)}">刪除</button></td>
  </tr>`).join('');
  tbody.onclick = e => {
    const del = e.target.closest('button.del');
    if (del) { fluDelete(del.dataset.delkey); return; }
  };
  tbody.onchange = e => {
    const cb = e.target;
    if (cb.type !== 'checkbox' || cb.dataset.i === undefined) return;
    const r = _fluRows[+cb.dataset.i];
    if (cb.checked) r.set.add(cb.dataset.code); else r.set.delete(cb.dataset.code);
    document.getElementById('flu-st-' + cb.dataset.i).innerHTML = fluStatus(r.set);
    document.getElementById('flu-tr-' + cb.dataset.i).style.background = (_fluCanon(r.set) !== r.orig) ? '#fff8e1' : '';
    renderFluBar();
  };
}

function fluStatus(set) {
  if (!set.size) return '<span class="badge seed">未參加</span>';
  if (set.size === 4) return '<span class="badge admin">全參加</span>';
  return `<span class="badge" style="background:#fff3e0;color:#e65100">參加${set.size}項</span>`;
}

function renderFluBar() {
  const bar = document.getElementById('fluBar');
  const dirty = _fluRows.filter(r => _fluCanon(r.set) !== r.orig).length;
  const cnt = { af:0, ac:0, vf:0, vc:0 };
  for (const r of _fluRows) r.set.forEach(c => cnt[c]++);
  bar.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${_fluRows.length
        ? `<button class="toolbar-like primary" onclick="fluSaveAll()" ${dirty ? '' : 'disabled'} style="padding:8px 14px;background:${dirty ? 'var(--blue)' : '#b8c4cf'};color:#fff;border:none;border-radius:6px;cursor:${dirty ? 'pointer' : 'not-allowed'};font-size:13px;font-weight:600">💾 儲存變更${dirty ? ' (' + dirty + ')' : ''}</button>
           <button onclick="fluAdd()" style="padding:8px 12px;background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">+ 新增院所</button>
           <button onclick="fluSeed(true)" style="padding:8px 12px;background:#fff;color:var(--danger);border:1px solid var(--danger);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">↺ 重設為 115 年預設名冊</button>`
        : `<button onclick="fluSeed(false)" style="padding:8px 14px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">⚡ 初始化 115 年名冊（42 家）</button>`}
      <span style="font-size:12px;color:var(--text2)">流感抗病毒 <b>${cnt.af}</b>｜新冠抗病毒 <b>${cnt.ac}</b>｜流感疫苗 <b>${cnt.vf}</b>｜新冠疫苗 <b>${cnt.vc}</b></span>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">勾選＝該院所已簽該類合約。儲存後主頁「💉 流感新冠」圖層重新整理即生效（最多延遲 1 分鐘）。新增院所名稱必須與主頁機構名稱一字不差；全新院所（地圖上沒有的）需另補主檔座標才會出現圖釘。</div>`;
  bar.style.display = 'block';
}

/* v1.0.4(Codex#3)：逐筆 try/catch 容錯 — 網路中斷不再靜默中止；
   成功列即時清除 dirty，失敗列保持黃底標記可直接再按儲存重試 */
async function fluSaveAll() {
  const dirty = _fluRows.filter(r => _fluCanon(r.set) !== r.orig);
  if (!dirty.length) return;
  let ok = 0, fail = 0;
  for (const r of dirty) {
    try {
      const res = await fetch('/api/table/kv_misc/' + encodeURIComponent(r.key), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: 'flu', value: _fluCanon(r.set), notes: r.notes })
      });
      if (res.ok) { ok++; r.orig = _fluCanon(r.set); } else fail++;
    } catch (_) { fail++; }
  }
  if (fail) {
    toast(`儲存 ${ok} 筆、失敗 ${fail} 筆（失敗列保持標記，可再按儲存重試）`, 'err');
    _fluRows.forEach((r, i) => {
      const tr = document.getElementById('flu-tr-' + i);
      if (tr) tr.style.background = (_fluCanon(r.set) !== r.orig) ? '#fff8e1' : '';
    });
    renderFluBar();
  } else {
    toast(`已儲存 ${ok} 筆`, 'ok');
    renderFluPanel();
  }
}

async function fluAdd() {
  const name = prompt('院所名稱（必須與主頁機構名稱一字不差）：');
  if (!name || !name.trim()) return;
  const res = await fetch('/api/table/kv_misc', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'flu:' + name.trim(), category: 'flu', value: '', notes: '' })
  });
  if (res.ok) { toast('已新增', 'ok'); renderFluPanel(); }
  else toast('新增失敗', 'err');
}

async function fluDelete(key) {
  if (!confirm('刪除 ' + key.slice(4) + ' 的合約設定？（主頁將改用內建預設值）')) return;
  const res = await fetch('/api/table/kv_misc/' + encodeURIComponent(key), { method: 'DELETE' });
  if (res.ok) { toast('已刪除', 'ok'); renderFluPanel(); }
  else toast('刪除失敗', 'err');
}

async function fluSeed(isReset) {
  if (isReset && !confirm('把 42 家院所全部重設回 115 年名冊預設值？（自行新增的其他院所不受影響）')) return;
  let ok = 0, fail = 0;
  /* v1.0.4(Codex#3)：逐筆 try/catch；寫入具冪等性，失敗可整批重按補齊 */
  for (const [name, val] of FLU_DEFAULTS) {
    try {
      const res = await fetch('/api/table/kv_misc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: 'flu:' + name, category: 'flu', value: val, notes: '115年流感/新冠合約' })
      });
      if (res.ok) ok++; else fail++;
    } catch (_) { fail++; }
  }
  toast(fail ? `寫入 ${ok} 筆、失敗 ${fail} 筆（可直接再按一次補齊）` : `完成：${ok} 筆`, fail ? 'err' : 'ok');
  renderFluPanel();
}

let currentTable = 'old_to_new';
let currentPage = 0;
const PAGE_SIZE = 50;
let totalRows = 0;
let editingRow = null;

// ─ Login ─
/* 誤按進來的人回地圖：齒輪是 target=_blank 新分頁（無歷史）就直接開主頁 */
function goBackToGis() {
  if (history.length > 1) history.back();
  else location.href = 'jialie_gis_v6.html';
}

async function login() {
  const pin = document.getElementById('pin').value;
  const msg = document.getElementById('loginMsg');
  msg.textContent = '驗證中...';
  msg.style.color = 'var(--text3)';
  const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin }) });
  if (res.ok) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    initUI();
  } else {
    msg.textContent = 'PIN 錯誤';
    msg.style.color = 'var(--danger)';
  }
}
async function logout() {
  await fetch('/api/logout', { method:'POST' });
  location.reload();
}
async function checkAuth() {
  const res = await fetch('/api/me');
  const { authenticated } = await res.json();
  if (authenticated) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    initUI();
  }
}
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ─ UI init ─
function initUI() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.entries(TABLES)
    .map(([k, t]) => `<div class="tab${k === currentTable ? ' active' : ''}" data-tab="${k}">${t.label}</div>`).join('');
  tabs.onclick = e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    switchTab(tab.dataset.tab);
  };
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { currentPage = 0; loadRows(); }
  });
  document.getElementById('sourceFilter').addEventListener('change', () => { currentPage = 0; loadRows(); });
  switchTab(currentTable);
}

function switchTab(name) {
  currentTable = name;
  currentPage = 0;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  const isCustom = !!TABLES[name].custom;
  document.querySelector('.toolbar').style.display = isCustom ? 'none' : 'flex';
  document.getElementById('fluBar').style.display = 'none';
  document.getElementById('exportOverlayBtn').style.display = (!isCustom && TABLES[name].supportsOverlayExport) ? 'inline-block' : 'none';
  if (isCustom) { renderFluPanel(); } else { loadRows(); }
}

// ─ Load rows ─
async function loadRows() {
  const q = document.getElementById('searchInput').value.trim();
  const source = document.getElementById('sourceFilter').value;
  const params = new URLSearchParams({
    limit: PAGE_SIZE,
    offset: currentPage * PAGE_SIZE,
  });
  if (q) params.set('q', q);
  if (source) params.set('source', source);

  const res = await fetch(`/api/table/${currentTable}?${params}`);
  if (res.status === 401) { location.reload(); return; }
  const data = await res.json();
  totalRows = data.total;
  renderTable(data.rows);
  renderPager();
}

function renderTable(rows) {
  const t = TABLES[currentTable];
  const thead = document.querySelector('#dataTable thead');
  const tbody = document.querySelector('#dataTable tbody');
  thead.innerHTML = '<tr>' + t.cols.map(c => `<th>${c.label}</th>`).join('') + '<th>來源</th><th>更新時間</th><th>操作</th></tr>';
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${t.cols.length + 3}" class="empty">查無資料</td></tr>`;
    return;
  }
  /* 事件委派 + 索引取列：主鍵含引號等特殊字元不會壞（inline onclick 會被 HTML
     解碼還原字元導致語法錯誤/注入） */
  tbody.innerHTML = rows.map((r, i) => `<tr>${
    t.cols.map(c => `<td>${esc(r[c.key])}</td>`).join('')
  }<td><span class="badge ${r.source}">${r.source}</span></td><td>${esc(r.updated_at || '')}</td><td class="actions">
    <button class="edit" data-i="${i}">編輯</button>
    <button class="del" data-i="${i}">刪除</button>
  </td></tr>`).join('');
  tbody._rows = rows;
  tbody.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b || b.dataset.i === undefined) return;
    const row = (tbody._rows || [])[+b.dataset.i];
    if (!row) return;
    if (b.classList.contains('del')) delRow(row[TABLES[currentTable].pk]);
    else if (b.classList.contains('edit')) editRow(row);
  };
}

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[<>&"']/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;' }[c]));
}

function renderPager() {
  const pages = Math.ceil(totalRows / PAGE_SIZE) || 1;
  const start = totalRows ? currentPage * PAGE_SIZE + 1 : 0;
  const end = Math.min((currentPage + 1) * PAGE_SIZE, totalRows);
  document.getElementById('pager').innerHTML = `
    <button onclick="currentPage = Math.max(0, currentPage-1); loadRows();" ${currentPage === 0 ? 'disabled' : ''}>← 上一頁</button>
    <span>第 ${currentPage + 1} / ${pages} 頁 (${start}–${end} / ${totalRows} 筆)</span>
    <button onclick="currentPage = Math.min(${pages - 1}, currentPage+1); loadRows();" ${currentPage >= pages - 1 ? 'disabled' : ''}>下一頁 →</button>
  `;
}

// ─ Create / Edit modal ─
function openCreateModal() {
  editingRow = null;
  renderEditModal({});
}
function editRow(row) {
  editingRow = row;
  renderEditModal(row);
}
function renderEditModal(row) {
  const t = TABLES[currentTable];
  const isEdit = !!editingRow;
  document.getElementById('modal').innerHTML = `
    <h3>${isEdit ? '編輯' : '新增'} — ${t.label}</h3>
    ${t.cols.map(c => `
      <div class="field">
        <label>${c.label}${c.required ? ' *' : ''}</label>
        ${c.textarea
          ? `<textarea id="f_${c.key}">${esc(row[c.key])}</textarea>`
          : `<input id="f_${c.key}" type="${c.type || 'text'}"${c.step ? ' step="' + c.step + '"' : ''}${c.readonly && isEdit ? ' readonly' : ''} value="${esc(row[c.key])}">`}
      </div>
    `).join('')}
    <div class="actions">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="saveRow()">${isEdit ? '更新' : '新增'}</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
}
async function saveRow() {
  const t = TABLES[currentTable];
  const body = {};
  for (const c of t.cols) {
    const el = document.getElementById(`f_${c.key}`);
    let v = el.value.trim();
    if (v === '' && c.key !== t.pk) continue;
    if (c.type === 'number') v = Number(v);
    body[c.key] = v;
  }
  // 必填檢查
  for (const c of t.cols.filter(c => c.required)) {
    if (body[c.key] === undefined || body[c.key] === '' || Number.isNaN(body[c.key])) {
      toast(`必填: ${c.label}`, 'err');
      return;
    }
  }
  const url = editingRow
    ? `/api/table/${currentTable}/${encodeURIComponent(editingRow[t.pk])}`
    : `/api/table/${currentTable}`;
  const method = editingRow ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const json = await res.json();
  if (res.ok) {
    closeModal();
    toast(editingRow ? '已更新' : '已新增', 'ok');
    loadRows();
  } else {
    toast('錯誤: ' + (json.error || res.status), 'err');
  }
}

async function delRow(id) {
  if (!confirm('確認刪除 ' + id + ' ?')) return;
  const res = await fetch(`/api/table/${currentTable}/${encodeURIComponent(id)}`, { method:'DELETE' });
  const json = await res.json();
  if (res.ok) {
    toast('已刪除', 'ok');
    loadRows();
  } else {
    toast('錯誤: ' + (json.error || res.status), 'err');
  }
}

// ─ Import ─
function openImportModal() {
  document.getElementById('modal').innerHTML = `
    <h3>匯入 — ${TABLES[currentTable].label}</h3>
    <div class="field">
      <label>選擇 CSV 檔 (UTF-8, 首列為欄位名稱)</label>
      <input type="file" id="importFile" accept=".csv,.txt">
    </div>
    <div class="field">
      <label>或直接貼上 CSV 內容</label>
      <textarea id="importText" rows="8" placeholder="${TABLES[currentTable].cols.map(c=>c.key).join(',')}"></textarea>
    </div>
    <div class="field">
      <label>模式</label>
      <select id="importMode">
        <option value="replace">replace (同主鍵覆蓋, 推薦)</option>
        <option value="append">append (同主鍵衝突回報錯)</option>
      </select>
    </div>
    <div class="actions">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="doImport()">匯入</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}
async function doImport() {
  let csv = document.getElementById('importText').value;
  const file = document.getElementById('importFile').files[0];
  if (file) csv = await file.text();
  if (!csv.trim()) { toast('請提供 CSV', 'err'); return; }
  const mode = document.getElementById('importMode').value;
  const res = await fetch(`/api/import/${currentTable}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ format:'csv', data: csv, mode })
  });
  const json = await res.json();
  if (res.ok) {
    closeModal();
    const pe = (json.parse_errors || []).length;
    const be = (json.batch_errors || []).length;
    if (pe || be) {
      toast(`匯入部分成功：${json.inserted} / ${json.total_in} 筆（格式錯誤略過 ${pe} 筆${be ? '、寫入失敗 ' + be + ' 批' : ''}）`, 'err');
    } else {
      toast(`匯入完成：${json.inserted} / ${json.total_in} 筆`, 'ok');
    }
    loadRows();
  } else {
    toast('錯誤: ' + (json.error || (json.batch_errors && json.batch_errors[0] && json.batch_errors[0].error) || res.status), 'err');
  }
}

// ─ Export ─
function doExport(format, hasOverlay = false) {
  const q = document.getElementById('searchInput').value.trim();
  const source = document.getElementById('sourceFilter').value;
  const p = new URLSearchParams({ format });
  if (q) p.set('q', q);
  if (source) p.set('source', source);
  if (hasOverlay) p.set('has_overlay', '1');
  window.location.href = `/api/export/${currentTable}?${p}`;
}

// ─ Toast ─
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + kind;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2400);
}

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});

checkAuth();
</script>
</body>
</html>
